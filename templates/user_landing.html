<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZTB Super App — Zero Trust Branch Assessment</title>
  <style>
    :root {
      --navy-dark: #002244;
      --navy:      #003366;
      --blue:      #0070c0;
      --accent:    #00aaff;
      --white:     #ffffff;
      --card-bg:   #0a2a50;
      --text-muted:#a0bcd8;
      --border:    rgba(0,170,255,0.25);
      --shadow:    0 8px 40px rgba(0,0,0,0.55);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--navy-dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .navbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0 2rem; height: 58px;
      background: rgba(0,22,44,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--blue), var(--accent));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 800; color: var(--white);
      box-shadow: 0 0 10px rgba(0,170,255,0.35);
      flex-shrink: 0;
    }
    .nav-brand { font-size: 1rem; font-weight: 700; color: var(--white); }
    .nav-badge {
      padding: 2px 9px;
      background: rgba(0,170,255,0.12);
      border: 1px solid rgba(0,170,255,0.35);
      border-radius: 20px; font-size: 0.67rem;
      font-weight: 600; color: var(--accent);
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .nav-spacer { flex: 1; }
    .nav-status { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-muted); }
    .nav-status-dot {
      width: 7px; height: 7px; background: #22c55e;
      border-radius: 50%; box-shadow: 0 0 6px rgba(34,197,94,0.6);
      animation: pulse-green 2s infinite;
    }
    @keyframes pulse-green { 0%,100%{opacity:1} 50%{opacity:0.45} }
    .hero {
      position: relative;
      background: linear-gradient(160deg, var(--navy-dark) 0%, var(--navy) 55%, #004d99 100%);
      padding: 5rem 2rem 9rem;
      text-align: center;
      overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,170,255,0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,170,255,0.055) 1px, transparent 1px);
      background-size: 48px 48px; pointer-events: none;
    }
    .hero::after {
      content: ''; position: absolute;
      top: -60px; left: 50%; transform: translateX(-50%);
      width: 560px; height: 360px;
      background: radial-gradient(ellipse, rgba(0,112,192,0.32) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-content { position: relative; z-index: 2; max-width: 680px; margin: 0 auto; }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800; line-height: 1.18; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--white) 40%, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .form-card-wrapper {
      position: relative; z-index: 10;
      max-width: 440px; margin: -4rem auto 0;
      padding: 0 1.5rem;
    }
    .form-card {
      background: linear-gradient(145deg, #0d2d52, #0a2244);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.2rem 2rem;
      box-shadow: var(--shadow);
    }
    .form-group { margin-bottom: 1.15rem; }
    .form-group label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: var(--text-muted); letter-spacing: 0.04em;
      text-transform: uppercase; margin-bottom: 0.4rem;
    }
    .form-group input {
      width: 100%; padding: 0.72rem 0.95rem;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(0,170,255,0.18);
      border-radius: 10px; color: var(--white);
      font-size: 0.95rem; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input::placeholder { color: rgba(160,188,216,0.4); }
    .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,170,255,0.13); }
    .form-group input.error-field { border-color: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,0.13); }
    .field-error { display: none; font-size: 0.76rem; color: #f87171; margin-top: 0.3rem; }
    .field-error.visible { display: block; }
    .global-error {
      display: none;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.32);
      border-radius: 8px; padding: 0.65rem 0.85rem;
      font-size: 0.82rem; color: #fca5a5;
      margin-bottom: 1rem; text-align: center;
    }
    .global-error.visible { display: block; }
    .submit-btn {
      width: 100%; padding: 0.82rem;
      background: linear-gradient(135deg, var(--blue), var(--accent));
      border: none; border-radius: 10px; color: var(--white);
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 18px rgba(0,112,192,0.45);
      margin-top: 0.5rem;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-spinner {
      display: none; width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .submit-btn.loading .btn-spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bom-section { text-align: center; margin: 5rem auto 4rem; padding: 0 1.5rem; }
    .bom-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 0.78rem 2rem;
      background: transparent; border: 1px solid var(--accent);
      border-radius: 10px; color: var(--accent);
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .bom-btn:hover { background: var(--accent); color: var(--white); box-shadow: 0 4px 18px rgba(0,170,255,0.35); transform: translateY(-1px); }
    .footer {
      border-top: 1px solid var(--border); padding: 1.6rem 2rem;
      text-align: center; background: rgba(0,0,0,0.2);
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.55rem;
    }
    .footer-logo { display: flex; align-items: center; gap: 0.45rem; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .footer-z {
      width: 20px; height: 20px;
      background: linear-gradient(135deg, var(--blue), var(--accent));
      border-radius: 5px; display: flex; align-items: center;
      justify-content: center; font-size: 0.65rem; font-weight: 800; color: var(--white);
    }
    .footer-sep { color: rgba(160,188,216,0.25); margin: 0 0.15rem; }
    .footer-copy { font-size: 0.76rem; color: rgba(160,188,216,0.4); }
    @media (max-width: 600px) {
      .hero { padding: 3.2rem 1rem 7.5rem; }
      .form-card-wrapper { margin-top: -3.5rem; }
      .form-card { padding: 1.7rem 1.3rem; }
      .navbar { padding: 0 1rem; }
      .nav-badge { display: none; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo">Z</div>
    <span class="nav-brand">ZTB Super App</span>
    <span class="nav-badge">Zero Trust Branch</span>
    <div class="nav-spacer"></div>
    <div class="nav-status">
      <span class="nav-status-dot"></span>
      <span>Ready</span>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <h1>Ready to assess your<br>Zero Trust Branch deal?</h1>
    </div>
  </section>

  <!-- FORM CARD -->
  <div class="form-card-wrapper">
    <div class="form-card">
      <div class="global-error" id="globalError"></div>
      <form id="landingForm" novalidate>

        <!-- Customer Name -->
        <div class="form-group">
          <label for="customer_name">Customer Name</label>
          <input type="text" id="customer_name" name="customer_name" required
                 placeholder="e.g. Acme Corporation" autocomplete="organization" />
          <div class="field-error" id="err_customer">Please enter the customer name.</div>
        </div>

        <!-- AE / SE Name -->
        <div class="form-group">
          <label for="se_name">AE / SE Name</label>
          <input type="text" id="se_name" name="se_name" required
                 placeholder="e.g. Jane Smith" autocomplete="name" />
          <div class="field-error" id="err_se">Please enter your name.</div>
        </div>

        <!-- Opportunity URL — REQUIRED -->
        <div class="form-group">
          <label for="opportunity_url">Opportunity URL</label>
          <input type="url" id="opportunity_url" name="opportunity_url" required
                 placeholder="https://zscaler.lightning.force.com/..." autocomplete="off" />
          <div class="field-error" id="err_opp">Please enter the Salesforce opportunity URL.</div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <div class="btn-spinner"></div>
          <span class="btn-text">Start Assessment &rarr;</span>
        </button>

      </form>
    </div>
  </div>

  <!-- BOM SECTION -->
  <div class="bom-section">
    <button class="bom-btn" onclick="window.location.href='/user/bom'">
      📋 Generate a BOM
    </button>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-logo">
      <div class="footer-z">Z</div>
      <span>ZTB Super App</span>
    </div>
    <span class="footer-sep">&bull;</span>
    <span class="footer-copy">&copy; 2025 Zscaler, Inc. &mdash; Internal Sales Engineering Tool</span>
  </footer>

  <script>
  (function () {
    'use strict';
    const form      = document.getElementById('landingForm');
    const submitBtn = document.getElementById('submitBtn');
    const globalErr = document.getElementById('globalError');

    function setFieldError(inputId, errId, show) {
      document.getElementById(inputId).classList.toggle('error-field', show);
      document.getElementById(errId).classList.toggle('visible', show);
    }
    function showGlobalError(text) { globalErr.textContent = text; globalErr.classList.add('visible'); }
    function hideGlobalError()     { globalErr.textContent = ''; globalErr.classList.remove('visible'); }
    function setLoading(on)        { submitBtn.disabled = on; submitBtn.classList.toggle('loading', on); }

    document.getElementById('customer_name').addEventListener('input', function () {
      setFieldError('customer_name', 'err_customer', false); hideGlobalError();
    });
    document.getElementById('se_name').addEventListener('input', function () {
      setFieldError('se_name', 'err_se', false); hideGlobalError();
    });
    document.getElementById('opportunity_url').addEventListener('input', function () {
      setFieldError('opportunity_url', 'err_opp', false); hideGlobalError();
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      hideGlobalError();
      const customerName   = document.getElementById('customer_name').value.trim();
      const seName         = document.getElementById('se_name').value.trim();
      const opportunityUrl = document.getElementById('opportunity_url').value.trim();
      let valid = true;
      if (!customerName)   { setFieldError('customer_name',   'err_customer', true); valid = false; }
      if (!seName)         { setFieldError('se_name',         'err_se',       true); valid = false; }
      if (!opportunityUrl) { setFieldError('opportunity_url', 'err_opp',      true); valid = false; }
      if (!valid) return;
      setLoading(true);
      try {
        const res = await fetch('/user/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            customer_name:   customerName,
            se_name:         seName,
            opportunity_url: opportunityUrl
          })
        });
        if (res.ok) {
          sessionStorage.setItem('customer_name',   customerName);
          sessionStorage.setItem('se_name',         seName);
          sessionStorage.setItem('opportunity_url', opportunityUrl);
          window.location.href = '/user/questions';
        } else {
          let errText = 'Something went wrong. Please try again.';
          try { const d = await res.json(); if (d && d.error) errText = d.error; } catch(_) {}
          showGlobalError(errText);
          setLoading(false);
        }
      } catch (_) {
        showGlobalError('Network error — please check your connection and try again.');
        setLoading(false);
      }
    });
  })();
  </script>
</body>
</html>
